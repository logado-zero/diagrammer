<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diagrammer</title>
    <!-- Applies the saved theme before first paint — React mounts too late to
         avoid a flash of the wrong one. Mirrors src/lib/theme.ts, which owns
         the class from then on. -->
    <script>
      try {
        var t = localStorage.getItem('diagrammer:theme')
        var d = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', d)
        document.documentElement.style.colorScheme = d ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
