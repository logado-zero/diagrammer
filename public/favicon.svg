<!-- Static twin of src/components/icons/DonutMark.tsx — same geometry
     (cx/cy 50, rOuter 44, rInner 22, segments .54/.28/.18) and same gradients,
     with the mark's #232839 stroke color filled in behind it so the white
     segment stays visible on a light tab bar. Keep in sync with that file. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Diagrammer">
  <defs>
    <linearGradient id="donut-teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7CF2D6"/>
      <stop offset="100%" stop-color="#2FCBA8"/>
    </linearGradient>
    <linearGradient id="donut-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
    <linearGradient id="donut-white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D7DEE8"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#232839"/>
  <g stroke="#232839" stroke-width="5" stroke-linejoin="round">
    <path fill="url(#donut-teal)"  d="M 39.058 92.618 A 44 44 0 1 0 50.000 6.000 L 50.000 28.000 A 22 22 0 1 1 44.529 71.309 Z"/>
    <path fill="url(#donut-amber)" d="M 10.188 31.266 A 44 44 0 0 0 39.058 92.618 L 44.529 71.309 A 22 22 0 0 1 30.094 40.633 Z"/>
    <path fill="url(#donut-white)" d="M 50.000 6.000 A 44 44 0 0 0 10.188 31.266 L 30.094 40.633 A 22 22 0 0 1 50.000 28.000 Z"/>
  </g>
</svg>
